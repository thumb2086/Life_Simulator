<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Simulator</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      font-family: 'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
      overflow: hidden;
      display: flex;
      height: 100vh;
    }
    #game-container {
      flex: 1;
      position: relative;
    }
    #side-panel {
      width: 320px;
      background: #16213e;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      border-left: 2px solid #0f3460;
    }
    #panel-header {
      background: #0f3460;
      padding: 12px 16px;
      font-size: 18px;
      font-weight: bold;
      color: #e94560;
      text-align: center;
      letter-spacing: 2px;
    }
    #panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    #panel-content::-webkit-scrollbar { width: 6px; }
    #panel-content::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #1a1a2e;
      font-size: 14px;
    }
    .stat-label { color: #8899aa; }
    .stat-value { color: #e94560; font-weight: bold; }
    .stat-value.green { color: #4ecca3; }
    .stat-value.gold { color: #f0c040; }

    .section-title {
      color: #e94560;
      font-size: 16px;
      font-weight: bold;
      margin: 12px 0 8px 0;
      padding-bottom: 4px;
      border-bottom: 1px solid #e94560;
    }

    .action-btn {
      display: block;
      width: 100%;
      padding: 8px 12px;
      margin: 4px 0;
      background: #0f3460;
      color: #e0e0e0;
      border: 1px solid #1a4080;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      text-align: left;
      transition: all 0.2s;
    }
    .action-btn:hover {
      background: #1a4080;
      border-color: #e94560;
      transform: translateX(3px);
    }
    .action-btn:active { transform: scale(0.97); }
    .action-btn.danger { border-color: #e94560; }
    .action-btn.danger:hover { background: #e94560; color: white; }
    .action-btn.success { border-color: #4ecca3; }
    .action-btn.success:hover { background: #4ecca3; color: #1a1a2e; }

    .event-log {
      background: #0d1b30;
      border-radius: 6px;
      padding: 8px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 8px;
    }
    .event-log div { border-bottom: 1px solid #1a1a2e; padding: 2px 0; }
    .event-log .income { color: #4ecca3; }
    .event-log .expense { color: #e94560; }

    #building-title {
      display: none;
      background: #e94560;
      color: white;
      padding: 8px 16px;
      font-size: 15px;
      font-weight: bold;
      text-align: center;
      border-radius: 6px 6px 0 0;
      margin: 0 -12px;
    }

    .tooltip {
      position: absolute;
      background: rgba(15, 52, 96, 0.95);
      color: #e0e0e0;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      pointer-events: none;
      z-index: 100;
      border: 1px solid #e94560;
      display: none;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="side-panel">
    <div id="panel-header">LIFE SIMULATOR</div>
    <div id="panel-content">
      <div id="building-title"></div>
      <div id="stats-section"></div>
      <div id="actions-section"></div>
      <div id="events-section"></div>
    </div>
  </div>
  <div id="tooltip" class="tooltip"></div>

  <script src="game.js"></script>
</body>
</html>
